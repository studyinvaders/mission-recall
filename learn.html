<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Briefing — Study Invaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .briefingSection{ margin-bottom:22px; }
  .briefingSection h3{
    font-family:'Press Start 2P', monospace;
    font-size:13px;
    color: var(--amber);
    letter-spacing:1px;
    margin:0 0 10px;
  }
  .summaryText{
    font-size:19px;
    line-height:1.5;
    color: var(--ink);
  }
  .highlightList{
    margin:0;
    padding-left:20px;
    font-size:18px;
    line-height:1.6;
    color: var(--ink);
  }
  .highlightList li{ margin-bottom:6px; }

  .keywordGrid{ display:flex; flex-direction:column; gap:10px; }
  .keywordCard{
    background: var(--void-deep);
    border:1px solid var(--panel-edge);
    border-radius:8px;
    padding:10px 14px;
  }
  .keywordTerm{
    color: var(--cyan);
    font-size:18px;
    font-weight:bold;
    margin-bottom:2px;
  }
  .keywordDef{
    color: var(--ink-dim);
    font-size:16px;
    line-height:1.4;
  }
  .navBtnGroup{ display:flex; gap:10px; align-items:center; }
  
  .langBar { display: flex; gap: 4px; }
  .langBtn {
    background: var(--void-deep);
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .langBtn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(76,224,210,0.1); }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div id="crt"></div>

<div class="stage">
  <div class="cabinet wide">

    <div class="topBar">
      <div class="navBtnGroup">
        <button class="btnGhost" id="mainMenuBtn">&larr; Main Menu</button>
        <button class="btnGhost" id="backBtn">Edit Notes</button>
        <div class="langBar">
          <button class="langBtn" id="btnEN" onclick="setLanguage('en')">EN</button>
          <button class="langBtn" id="btnBM" onclick="setLanguage('bm')">BM</button>
        </div>
      </div>
      <span class="agentTag">Agent: <span id="agentName">—</span></span>
    </div>
    <h2 id="t_title">MISSION BRIEFING</h2>

    <div class="briefingSection">
      <h3 id="t_summary">Summary</h3>
      <p class="summaryText" id="summaryText"></p>
    </div>

    <div class="briefingSection">
      <h3 id="t_highlights">Key Highlights</h3>
      <ul class="highlightList" id="highlightList"></ul>
    </div>

    <div class="briefingSection">
      <h3 id="t_keywords">Keywords</h3>
      <div class="keywordGrid" id="keywordGrid"></div>
    </div>

    <button class="btnPrimary ready" id="launchBtn">LAUNCH MISSION &gt;</button>

    <p class="creditFooter">Made by Computer System Operation &middot; Sarawak Skills Sri Aman</p>

  </div>
</div>

<script src="assets/starfield.js"></script>
<script>
const i18n = {
  en: {
    mainMenu: "&larr; Main Menu",
    editNotes: "Edit Notes",
    title: "MISSION BRIEFING",
    summary: "Summary",
    highlights: "Key Highlights",
    keywords: "Keywords",
    launchBtn: "LAUNCH MISSION &gt;"
  },
  bm: {
    mainMenu: "&larr; Menu Utama",
    editNotes: "Edit Nota",
    title: "TAKLIMAT MISI",
    summary: "Ringkasan",
    highlights: "Sorotan Utama",
    keywords: "Kata Kunci",
    launchBtn: "LANCARKAN MISI &gt;"
  }
};

let currentLang = localStorage.getItem('si_lang') || 'en';

function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('si_lang', lang);
  document.getElementById('btnEN').classList.toggle('active', lang === 'en');
  document.getElementById('btnBM').classList.toggle('active', lang === 'bm');

  const dict = i18n[lang];
  document.getElementById('mainMenuBtn').innerHTML = dict.mainMenu;
  document.getElementById('backBtn').textContent = dict.editNotes;
  document.getElementById('t_title').textContent = dict.title;
  document.getElementById('t_summary').textContent = dict.summary;
  document.getElementById('t_highlights').textContent = dict.highlights;
  document.getElementById('t_keywords').textContent = dict.keywords;
  document.getElementById('launchBtn').innerHTML = dict.launchBtn;
}

const username = sessionStorage.getItem('si_username');
const noteRaw = sessionStorage.getItem('si_note');
const learnDataRaw = sessionStorage.getItem('si_learnData');

if(!username || !noteRaw || !learnDataRaw){
  window.location.href = 'index.html';
}

const learnData = learnDataRaw ? JSON.parse(learnDataRaw) : null;
document.getElementById('agentName').textContent = username || '—';

if(learnData){
  document.getElementById('summaryText').textContent = learnData.summary || '';

  const highlightList = document.getElementById('highlightList');
  (learnData.highlights || []).forEach(h => {
    const li = document.createElement('li');
    li.textContent = h;
    highlightList.appendChild(li);
  });

  const keywordGrid = document.getElementById('keywordGrid');
  (learnData.keywords || []).forEach(k => {
    const card = document.createElement('div');
    card.className = 'keywordCard';
    const term = document.createElement('div');
    term.className = 'keywordTerm';
    term.textContent = k.term;
    const def = document.createElement('div');
    def.className = 'keywordDef';
    def.textContent = k.definition;
    card.appendChild(term);
    card.appendChild(def);
    keywordGrid.appendChild(card);
  });
}

setLanguage(currentLang);

document.getElementById('mainMenuBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
document.getElementById('launchBtn').addEventListener('click', () => { window.location.href = 'play.html'; });
</script>

</body>
</html>
