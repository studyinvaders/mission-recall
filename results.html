<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Results — Study Invaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .navBtnGroup{ display:flex; gap:10px; align-items:center; }
  
  .langBar { display: flex; gap: 4px; }
  .langBtn {
    background: var(--void-deep);
    border: 1px solid var(--panel-edge);
    color: var(--ink-dim);
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .langBtn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(76,224,210,0.1); }

  .scoreHero{ text-align:center; margin-bottom:22px; }
  .scoreHero .bigScore{
    font-family:'Press Start 2P', monospace;
    font-size:36px;
    color: var(--amber);
    text-shadow: 0 0 16px rgba(255,209,102,0.4);
    margin-bottom:6px;
  }
  .scoreHero .scoreSub{ color: var(--ink-dim); font-size:18px; }

  .breakdownSection h3{
    font-family:'Press Start 2P', monospace;
    font-size:13px;
    color: var(--amber);
    letter-spacing:1px;
    margin:0 0 12px;
  }
  .topicRow{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:17px;
  }
  .topicName{ flex:1; color: var(--ink); }
  .topicBar{
    flex:1;
    height:10px;
    background: var(--void-deep);
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--panel-edge);
  }
  .topicBarFill{ height:100%; background: linear-gradient(90deg, var(--cyan), #2bb8ac); }
  .topicFrac{ width:44px; text-align:right; color: var(--ink-dim); font-size:15px; }

  .actionRow{ display:flex; gap:10px; margin-top:24px; }
  .actionRow .btnPrimary, .actionRow .btnGhost{ flex:1; }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div id="crt"></div>

<div class="stage">
  <div class="cabinet wide">

    <div class="topBar">
      <div class="navBtnGroup">
        <button class="btnGhost" id="menuBtn">&larr; Menu</button>
        <div class="langBar">
          <button class="langBtn" id="btnEN" onclick="setLanguage('en')">EN</button>
          <button class="langBtn" id="btnBM" onclick="setLanguage('bm')">BM</button>
        </div>
      </div>
      <span class="agentTag">Agent: <span id="agentName">—</span></span>
    </div>
    <h2 style="text-align:center;" id="t_title">MISSION RESULTS</h2>

    <div class="scoreHero">
      <div class="bigScore" id="bigScore">0</div>
      <div class="scoreSub" id="scoreSub">0 / 0 correct</div>
    </div>

    <div class="breakdownSection">
      <h3 id="t_byTopic">By Topic</h3>
      <div id="topicBreakdown"></div>
    </div>

    <div class="actionRow">
      <button class="btnGhost" id="menuBtnBottom">Back to Menu</button>
      <button class="btnPrimary ready" id="retryBtn">Try Another Mission</button>
    </div>

    <p class="creditFooter">Made by Computer System Operation &middot; Sarawak Skills Sri Aman</p>

  </div>
</div>

<script src="assets/starfield.js"></script>
<script>
const i18n = {
  en: {
    menuBtn: "&larr; Menu",
    title: "MISSION RESULTS",
    byTopic: "By Topic",
    menuBtnBottom: "Back to Menu",
    retryBtn: "Try Another Mission",
    correct: "correct",
    complete: "Mission Complete",
    failed: "Mission Failed",
    noData: "No topic data available for this mission."
  },
  bm: {
    menuBtn: "&larr; Menu",
    title: "KEPUTUSAN MISI",
    byTopic: "Mengikut Topik",
    menuBtnBottom: "Kembali ke Menu",
    retryBtn: "Cuba Misi Lain",
    correct: "betul",
    complete: "Misi Selesai",
    failed: "Misi Gagal",
    noData: "Tiada data topik tersedia untuk misi ini."
  }
};

let currentLang = localStorage.getItem('si_lang') || 'en';

const username = sessionStorage.getItem('si_username');
const resultsRaw = sessionStorage.getItem('si_quizResults');

if(!username || !resultsRaw){
  window.location.href = 'index.html';
}

const results = resultsRaw ? JSON.parse(resultsRaw) : null;
document.getElementById('agentName').textContent = username || '—';

function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('si_lang', lang);
  document.getElementById('btnEN').classList.toggle('active', lang === 'en');
  document.getElementById('btnBM').classList.toggle('active', lang === 'bm');

  const dict = i18n[lang];
  document.getElementById('menuBtn').innerHTML = dict.menuBtn;
  document.getElementById('t_title').textContent = dict.title;
  document.getElementById('t_byTopic').textContent = dict.byTopic;
  document.getElementById('menuBtnBottom').textContent = dict.menuBtnBottom;
  document.getElementById('retryBtn').textContent = dict.retryBtn;

  if(results){
    const statusText = results.completed ? dict.complete : dict.failed;
    document.getElementById('scoreSub').textContent =
      `${results.correctCount} / ${results.total} ${dict.correct} — ${statusText}`;
      
    const breakdown = document.getElementById('topicBreakdown');
    if(!results.log || results.log.length === 0){
      breakdown.innerHTML = `<p style="color:var(--ink-dim); font-size:16px;">${dict.noData}</p>`;
    }
  }
}

if(results){
  document.getElementById('bigScore').textContent = results.score;

  const bySubtopic = {};
  (results.log || []).forEach(entry => {
    if(!bySubtopic[entry.subtopic]) bySubtopic[entry.subtopic] = { correct: 0, total: 0 };
    bySubtopic[entry.subtopic].total++;
    if(entry.correct) bySubtopic[entry.subtopic].correct++;
  });

  const breakdown = document.getElementById('topicBreakdown');
  breakdown.innerHTML = '';
  Object.entries(bySubtopic).forEach(([topic, stats]) => {
    const pct = Math.round((stats.correct / stats.total) * 100);
    const row = document.createElement('div');
    row.className = 'topicRow';
    row.innerHTML = `
      <div class="topicName">${topic}</div>
      <div class="topicBar"><div class="topicBarFill" style="width:${pct}%"></div></div>
      <div class="topicFrac">${stats.correct}/${stats.total}</div>
    `;
    breakdown.appendChild(row);
  });
}

setLanguage(currentLang);

document.getElementById('menuBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
document.getElementById('menuBtnBottom').addEventListener('click', () => { window.location.href = 'index.html'; });
document.getElementById('retryBtn').addEventListener('click', () => { window.location.href = 'play.html'; });
</script>

</body>
</html>
